[package]
name = "lode"
version = "0.1.0"
description = "Proof of work gated by verified human movement"
edition = "2021"
license = "MIT"
repository = "https://github.com/Lideeyah/lode"

[lib]
crate-type = ["cdylib", "lib"]
name = "lode"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# init-if-needed is required by the miner and destination token accounts,
# both of which are PDA/ATA derived and so cannot be re-initialised by an
# attacker to a different address.
anchor-lang = { version = "1.2.1", features = ["init-if-needed"] }
anchor-spl = "1.2.1"
# Anchor 1.x no longer re-exports a hash module, so the sha256 syscall and
# the sysvar addresses come straight from the split crates.
solana-sha256-hasher = "3.1.0"
solana-sdk-ids = "3.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
